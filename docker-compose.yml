services:
  mathexam:
    build: .
    container_name: math-exam-agent
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./fonts:/usr/local/share/fonts/mathexam:ro
    command: >
      sh -c "fc-cache -f /usr/local/share/fonts/mathexam || true;
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)); raise SystemExit(0 if data.get('status') in ('ok', 'degraded') else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
